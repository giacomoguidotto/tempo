name: Expo Fix

on:
  pull_request:
    branches: [main]
    paths:
      - app/package.json
      - bun.lock

permissions:
  contents: write

jobs:
  expo-fix:
    name: Fix Expo SDK Versions
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
        env:
          HUSKY: "0"
      - name: Fix Expo SDK version mismatches
        working-directory: app
        run: bunx expo install --fix
      - name: Commit if changed (via API for verified signature)
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.PAT }}
        run: |
          git add app/package.json bun.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          REPO="${{ github.repository }}"
          BRANCH="${{ github.head_ref }}"
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_TREE=$(git rev-parse HEAD^{tree})

          # Upload changed files as blobs (GITHUB_TOKEN → verified signature)
          TREE_ENTRIES="[]"
          while IFS= read -r file; do
            BLOB_SHA=$(base64 -w 0 < "$file" \
              | jq -Rs '{"content": ., "encoding": "base64"}' \
              | gh api "repos/${REPO}/git/blobs" --input - --jq '.sha')
            TREE_ENTRIES=$(echo "$TREE_ENTRIES" | jq \
              --arg path "$file" --arg sha "$BLOB_SHA" \
              '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
          done < <(git diff --cached --name-only --diff-filter=d)

          # Create tree
          TREE_SHA=$(jq -n \
            --arg base "$BASE_TREE" --argjson tree "$TREE_ENTRIES" \
            '{"base_tree": $base, "tree": $tree}' \
            | gh api "repos/${REPO}/git/trees" --input - --jq '.sha')

          # Create commit (GITHUB_TOKEN auto-signs → verified)
          COMMIT_SHA=$(jq -n \
            --arg msg "chore: fix expo doctor version mismatches" \
            --arg tree "$TREE_SHA" --arg parent "$HEAD_SHA" \
            '{"message": $msg, "tree": $tree, "parents": [$parent]}' \
            | gh api "repos/${REPO}/git/commits" --input - --jq '.sha')

          # Fast-forward the branch (PAT so the push triggers CI workflows)
          jq -n --arg sha "$COMMIT_SHA" '{"sha": $sha}' \
            | GH_TOKEN="$PAT" gh api "repos/${REPO}/git/refs/heads/${BRANCH}" \
              --method PATCH --input -

          echo "Created verified commit ${COMMIT_SHA:0:7}"
